name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SCARF_ANALYTICS: "false"
  CHECKPOINT_DISABLE: "1"

jobs:
  checks:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: devflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # CI-only values for the throwaway service containers; not secrets.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/devflow_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/devflow_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run openapi:check
      - run: npm test
      - run: npm run build

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: devflow-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
