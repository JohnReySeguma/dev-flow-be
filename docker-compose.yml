# Development: `npm run db:up` starts only postgres and redis; the API runs on the host.
# Review/production: `docker compose up --build` runs the whole stack.
name: devflow

services:
  api:
    build: .
    image: devflow-api:local
    init: true # tini as PID 1 forwards SIGTERM to Node for a graceful shutdown
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file: .env
    environment:
      # Overrides for the container network; everything else comes from .env.
      NODE_ENV: production
      # Production requires these to be chosen explicitly. This stack is for review, so it keeps the
      # demo data and logged emails unless .env says otherwise.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/devflow
      REDIS_URL: redis://redis:6379
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github-app.pem
    volumes:
      # The key stays on the host and is mounted read-only, never copied into the image.
      # Unset → /dev/null, which the API treats as "GitHub integration disabled".
      - ${GITHUB_APP_PRIVATE_KEY_FILE:-/dev/null}:/run/secrets/github-app.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devflow
    ports:
      # Published on localhost only, so `npm run dev` and `npm test` on the host can connect but other
      # machines cannot (Docker's port publishing bypasses host firewalls).
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
